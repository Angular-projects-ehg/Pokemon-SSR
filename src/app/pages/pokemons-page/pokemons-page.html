<h1 class="text-3xl font-bold">Listado de pokemons</h1>
<h2 class="text-xl">Pagina actual: {{ currentPage() }}</h2>


<hr class="my-2">


@if (pokemonsResource.value()) {
    <app-pokemon-list
      [pokemons]="pokemonsResource.value() || []"
      [currentPage]="currentPage()"
    />
} @else {
    <app-pokemon-list-skeleton />
}
