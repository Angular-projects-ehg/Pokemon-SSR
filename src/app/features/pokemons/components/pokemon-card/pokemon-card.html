<a
  [routerLink]="['/pokemons', pokemon().id]"
  class="bg-slate-800/80 border border-slate-700/60 h-44 rounded-lg shadow-md flex flex-col p-4 items-center justify-center cursor-pointer hover:bg-slate-700/80 transition-colors"
>
    <img
    [src]="'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/dream-world/' + pokemon().id + '.svg'"
    [alt]="pokemon().name"
    class="w-24 h-24"
    width="96px"
    height="96px"
    />

   <div class="text-center mt-2">
    <h2 class="text-xl font-bold capitalize text-white">{{ pokemon().name }}</h2>
   </div>
</a>
