<div class="grid grid-cols-1 sm:grid-cols-3 gap-3 md:grid-cols-5">


    @for (pokemon of pokemons(); track $index) {
        <app-pokemon-card [pokemon]="pokemon" />
    }
    @empty {
        <div class="col-span-5 text-center border-white h-28 flex justify-center items-center">
            No hay pokemons
        </div>
    }


</div>
<div class="flex justify-between mt-4">
    @if (currentPage() > 1) {
        <a
          class="mt-2 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 transition-all cursor-pointer"
          [routerLink]="['/pokemons/page', currentPage() - 1]"
        >
          Anteriores
        </a>
    } @else {
        <span class="mt-2 bg-slate-600 text-white px-4 py-2 rounded opacity-70 cursor-not-allowed">
          Anteriores
        </span>
    }
    <a
      class="mt-2 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 transition-all cursor-pointer"
      [routerLink]="['/pokemons/page', currentPage() + 1]"
    >
      Siguientes
    </a>
</div>
